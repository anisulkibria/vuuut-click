[workspace]
resolver = "2"
members = ["crates/click-core", "crates/click-store", "crates/click-server", "crates/click-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
click-core = { path = "crates/click-core", version = "0.1.0" }
click-store = { path = "crates/click-store", version = "0.1.0" }
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8.6", features = ["form", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
clickhouse = { version = "0.13.3", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
url = "2.5"
ipnet = "2.11"
maxminddb = "0.32"
argon2 = "0.5"
rand = "0.8"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
anyhow = "1"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.11"
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls", "ring", "webpki-roots"] }

[profile.release]
lto = "thin"
strip = true
