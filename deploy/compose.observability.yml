# Merge with compose.production.yml. Ports remain loopback-only.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro", "${OPS_SECRETS_DIR:?Set private OPS_SECRETS_DIR}/metrics_token:/run/secrets/metrics_token:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  alertmanager:
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro", "alertmanager_data:/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 96m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  otel:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./observability/otel.yml:/etc/otel/config.yml:ro", "otel_data:/tmp"]
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/etc/grafana/dashboards:ro", "${OPS_SECRETS_DIR:?Set private OPS_SECRETS_DIR}/grafana_password:/run/secrets/grafana_password:ro", "grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  prometheus_data:
  alertmanager_data:
  otel_data:
  grafana_data:
