name: vuuut-click-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: click
      POSTGRES_DB: click
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click -d click"]
      interval: 2s
      timeout: 3s
      retries: 60
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    environment:
      CLICKHOUSE_USER: click
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: click
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:58123:8123"]
    volumes: ["ch_data:/var/lib/clickhouse", "./clickhouse/50-memory-bounds.xml:/etc/clickhouse-server/users.d/50-vuuut-click-memory.xml:ro"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user click --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  pg_data:
  ch_data:
