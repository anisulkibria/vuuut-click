# Optional three-repository integration suite. Main Click builds stay standalone.
[package]
name = "vuuut-native-bridge-tests"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
click-server = { path = "../../crates/click-server" }
click-store = { path = "../../crates/click-store" }
click-core = { path = "../../crates/click-core" }
ghost-api = { path = "../../../Vuuut/crates/ghost-api" }
ghost-core = { path = "../../../Vuuut/crates/ghost-core" }
ghost-db = { path = "../../../Vuuut/crates/ghost-db" }
ghost-render = { path = "../../../Vuuut/crates/ghost-render" }
ghost-routing = { path = "../../../Vuuut/crates/ghost-routing" }
ghost-front = { path = "../../../Vuuut/crates/ghost-front" }
ghost-admin-ui = { path = "../../../Vuuut/crates/ghost-admin-ui" }
pro-core = { path = "../../../Vuuut-pro/crates/pro-core" }
pro-db = { path = "../../../Vuuut-pro/crates/pro-db" }
pro-provision = { path = "../../../Vuuut-pro/crates/pro-provision" }
pro-supervisor = { path = "../../../Vuuut-pro/crates/pro-supervisor" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "mysql", "any", "uuid", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

url = "2.5"
