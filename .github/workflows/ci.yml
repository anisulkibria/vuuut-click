name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust-and-real-stack:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_USER: click, POSTGRES_DB: click, POSTGRES_PASSWORD: ci_test_only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U click -d click" --health-interval 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.4.13
        env: {CLICKHOUSE_USER: click, CLICKHOUSE_DB: click, CLICKHOUSE_PASSWORD: ci_test_only, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'}
        ports: ["8123:8123"]
        options: --health-cmd "clickhouse-client --user click --password ci_test_only --query 'SELECT 1'" --health-interval 5s --health-retries 30
    env:
      APP_ENV: development
      ALLOW_LOCALHOST: 'true'
      DATABASE_URL: postgres://click:ci_test_only@localhost:5432/click
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: click
      CLICKHOUSE_PASSWORD: ci_test_only
      CLICKHOUSE_DATABASE: click
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --include-ignored --test-threads=1
      - name: Python recovery safety guards
        run: |
          python3 -m venv /tmp/click-ops-venv
          /tmp/click-ops-venv/bin/pip install -r scripts/requirements-ops.txt -r scripts/requirements-release.txt
          /tmp/click-ops-venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate complete OpenAPI contract
        run: /tmp/click-ops-venv/bin/python scripts/validate-contract.py
      - name: Encrypted restore and arrival-rate smoke drill
        run: |
          python3 scripts/install-ops-tools.py restic
          cargo build --locked -p click-server
          export BACKUP_PG_CONTAINER="$(docker ps --filter ancestor=postgres:17.6-alpine --format '{{.ID}}')"
          /tmp/click-ops-venv/bin/python scripts/validate-operations.py --volume-rows 10000 --duration 5
      - uses: actions/setup-node@v7.1.0
        with: {node-version: '24', cache: npm}
      - run: npm ci && npm run check && npm run build && npm run test:sdk
      - name: Check SDK package and licenses
        run: |
          python3 scripts/release.py build --output .local/ci-release
          git diff --exit-code -- tracker/dist
      - run: npx playwright install --with-deps chromium
      - name: Real browser tests
        run: |
          cargo run --locked -p click-server -- serve > /tmp/click-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8082/readyz && break; sleep 1; done
          /tmp/click-ops-venv/bin/python scripts/validate-contract.py --base http://localhost:8082
          npm run test:e2e

  security-and-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/install-ops-tools.py
      - name: Source vulnerabilities, secrets and license policy
        run: python3 scripts/security-scan.py
      - name: Build hardened Linux runtime
        run: docker build --tag vuuut-click:ci .
      - name: Scan source and final runtime image
        run: python3 scripts/security-scan.py --image vuuut-click:ci
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: operational-security-evidence
          path: |
            .local/ops/security-evidence.json
            .local/ops/source-sbom.cdx.json
